<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 100 100" preserveAspectRatio="none">
    <foreignObject x="0" y="0" width="100" height="100">
        <html xmlns="http://www.w3.org/1999/xhtml">
            <head>
                <meta charset="UTF-8"/>
                <style>
                    html, body {
                        margin: 0;
                        width: 100%;
                        height: 100%;
                        overflow: hidden;
                        background: #111;
                    }

                    iframe {
                        width: 100%;
                        height: 100%;
                        border: 0;
                        display: block;
                    }

                    #controls {
                        position: fixed;
                        top: 10px;
                        right: 10px;
                        z-index: 9999;
                        display: flex;
                        gap: 6px;
                        opacity: 0;
                        transition: opacity .2s;
                    }

                    #controls:hover {
                        opacity: 1;
                    }

                    button {
                        border: 0;
                        border-radius: 6px;
                        padding: 8px 12px;
                        background: #222;
                        color: white;
                        cursor: pointer;
                    }

                    button:hover {
                        background: #333;
                    }
                </style>
            </head>

            <body>
                <iframe
                    id="site"
                    src="http://135.148.42.208:5000/"
                    allow="fullscreen; autoplay; gamepad; clipboard-read; clipboard-write"
                    allowfullscreen="allowfullscreen">
                </iframe>

                <div id="controls">
                    <button onclick="fullscreen()">Fullscreen</button>
                    <button onclick="reloadSite()">Reload</button>
                </div>

                <script>
                    function fullscreen() {
                        const site = document.getElementById("site");

                        if (site.requestFullscreen) {
                            site.requestFullscreen();
                        }
                    }

                    function reloadSite() {
                        const site = document.getElementById("site");
                        site.src = site.src;
                    }
                </script>
            </body>
        </html>
    </foreignObject>
</svg>