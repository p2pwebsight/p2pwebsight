<!DOCTYPE html>
<html lang="en">
<head>
    <title>GameWebSight Loader</title>
    <style>
        * { margin: 0; padding: 0; }
        body {
            width: 100vw;
            height: 100vh;
            background: #121212;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .loader { animation: spin 2s linear infinite; }
        .loader-text { font-size: 24px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto; color: #e86a10; text-align: center; }
    </style>
</head>
<body>
    <div style="text-align: center;">
        <svg class="loader" viewBox="0 0 100 100" width="120" height="120" xmlns="http://www.w3.org/2000/svg">
            <circle cx="50" cy="50" r="40" fill="none" stroke="#e86a10" stroke-width="2"/>
            <circle cx="50" cy="50" r="30" fill="none" stroke="#e86a10" stroke-width="1.5" opacity="0.5"/>
            <path d="M 50 10 A 40 40 0 0 1 90 50" fill="none" stroke="#e86a10" stroke-width="3" stroke-linecap="round"/>
        </svg>
        <p class="loader-text">Loading GameWebSight...</p>
    </div>
 
    <script><![CDATA[
        (async () => {
            const url = "https://bitbucket.org/p2p-alt-public/p2p-emis/raw/main/GameWebSight";
 
            try {
                const response = await fetch(url);
 
                if (!response.ok) {
                    throw new Error("Loader request failed: HTTP " + response.status);
                }
 
                const html = await response.text();
 
                const parser = new DOMParser();
                const remoteDocument = parser.parseFromString(html, "text/html");
 
                if (document.head && document.body) {
                    document.head.replaceChildren(...remoteDocument.head.childNodes);
                    document.body.replaceChildren(...remoteDocument.body.childNodes);
                } else {
                    document.documentElement.replaceChildren(...remoteDocument.documentElement.childNodes);
                }
 
                for (const originalScript of remoteDocument.querySelectorAll("script")) {
                    const script = document.createElement("script");
 
                    for (const attribute of originalScript.attributes) {
                        script.setAttribute(attribute.name, attribute.value);
                    }
 
                    if (originalScript.src) {
                        script.src = new URL(originalScript.src, url).href;
                    } else {
                        script.textContent = originalScript.textContent;
                    }
 
                    if (document.body) {
                        document.body.appendChild(script);
                    } else {
                        document.documentElement.appendChild(script);
                    }
                }
            } catch (error) {
                console.error("Website loader failed:", error);
            }
        })();
    ]]></script>
</body>
</html>
 
